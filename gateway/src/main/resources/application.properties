spring.application.name=gatewayserver
spring.config.import=optional:configserver:http://localhost:8070/

spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.default-filters=TokenRelay


# JWT Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/chirp/protocol/openid-connect/certs

# OAuth2 Client Configuration
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/chirp

spring.security.oauth2.client.registration.spring-with-test-scope.provider=keycloak
spring.security.oauth2.client.registration.spring-with-test-scope.client-id=chirp
spring.security.oauth2.client.registration.spring-with-test-scope.client-secret=N3Ig4pxmtpeKYZNo2zuAN2i3Ev5EgNRL
spring.security.oauth2.client.registration.spring-with-test-scope.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.spring-with-test-scope.scope=openid